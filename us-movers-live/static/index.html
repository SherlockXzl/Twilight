<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>夜盘异动</title>
<!-- 站点图标：直接用侧栏那张 logo.png（192×192，浏览器自己缩到标签页大小），
     不另存一份小图 —— 见 shell.js 的 renderSidebar，两处指的是同一张。
     相对路径不带 /，与 style.css 同级。 -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="top" id="pageHeader"></header>

    <div class="panel" id="notice" style="display:none"></div>

    <!-- tabs--filter：分档筛选器。与早盘页的 tabs--page（子页面切换）是两种控件，
         样式在 style.css 里分别定义，不要合并。详见 style.css 顶部「标签页的两种身份」注释。 -->
    <div class="tabs tabs--filter" id="tabs"></div>
    <div class="hint criteria" id="criteriaLine">加载中…</div>

    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索代码 / 公司 / 板块 / 行业…">
      <div id="sectorSel" class="combo"></div>
      <div id="industrySel" class="combo"></div>
      <span class="hint" id="rowInfo"></span>
    </div>

    <div id="tableHost"></div>

    <div class="panel" id="exclPanel" style="display:none">
      <details class="excl">
        <summary id="exclSummary">被“市值 ≤ 15 亿美元”门槛剔除的异动（仅供对照）</summary>
        <div id="exclHost"></div>
      </details>
    </div>
  </main>

</div>
<script src="util.js"></script>
<script src="icons.js"></script>
<script src="combo.js"></script>
<script src="modal.js"></script>
<!-- sharemap.js：把「A 股映射」的数据渲染成弹窗内容。
     与 evening.js 分开是因为它是纯函数（数据 → HTML 字符串），可以单独跑单测；
     内容结构又长，塞进页面脚本会把分档/筛选那部分逻辑淹掉。 -->
<script src="sharemap.js"></script>
<script src="shell.js"></script>
<script src="evening.js"></script>
</body>
</html>
