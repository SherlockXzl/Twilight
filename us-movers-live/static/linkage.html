<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>明暗对照</title>
<!-- 站点图标：与另两页同一张 logo.png，见 shell.js 的说明。 -->
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar"></aside>

  <main class="main">
    <header class="top" id="pageHeader"></header>

    <div class="panel" id="notice" style="display:none"></div>

    <!-- toolbar 与「夜盘异动」页是同一套控件（见 evening.js 的 renderFilters）：
         搜索框 + 板块下拉 + 行业下拉 + 条数提示。
         这里**没有分档标签页** —— 全市场目录不做涨跌分档，那是行情页的事；
         也没有「口径说明」行，因为这张表没有市值门槛之类的筛选规则。 -->
    <div class="toolbar">
      <input type="search" id="q" placeholder="搜索代码 / 公司 / 板块 / 行业…">
      <div id="sectorSel" class="combo"></div>
      <div id="industrySel" class="combo"></div>
      <!-- 「只看有 A 股映射」：只留在 A 股有对标公司的美股。
           口径是 peers 非空，不是"有映射数据" —— 全市场 4279 家都有行业说明，
           但其中两百多家所属行业在 A 股没有对标，点开看不到任何 A 股公司。 -->
      <label class="chk" title="只显示在 A 股有对标公司的美股；所属行业在 A 股没有对标的会隐藏">
        <input type="checkbox" id="bizOnly"><span>只看有 A 股映射</span>
      </label>
      <span class="hint" id="rowInfo"></span>
    </div>

    <div id="tableHost"><div class="empty">加载中…</div></div>

    <!-- 分页条：由 linkage.js 的 renderPager() 填充；只有一页时它会把这里清空 -->
    <div class="pager" id="pager"></div>
  </main>

</div>
<script src="util.js"></script>
<script src="icons.js"></script>
<script src="combo.js"></script>
<!-- bizmap.js：把「A 股公司业务映射」的三张引用表组装成单条映射。
     必须排在 linkage.js 之前 —— 它还要给早盘总结页用（那边是悬停提示）。 -->
<script src="bizmap.js"></script>
<!-- mapbtn.js：映射列的「点击查看」按钮，与夜盘异动页共用同一份实现 -->
<script src="mapbtn.js"></script>
<script src="modal.js"></script>
<!-- businessmap.js：把「A 股公司业务映射」的数据渲染成弹窗内容（纯函数）。
     与 night 页的 sharemap.js 是两套口径（那边是事件驱动、这边是业务相似度），
     所以是两个渲染器，别合并。 -->
<script src="businessmap.js"></script>
<script src="shell.js"></script>
<script src="linkage.js"></script>
</body>
</html>
